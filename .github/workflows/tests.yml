name: Python IAM audit tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate sample report
        run: |
          python analyzer.py data/sample_accounts.csv --as-of 2026-11-02 --output /tmp/iam-audit-reports
          python -c "import json; r=json.load(open('/tmp/iam-audit-reports/findings.json')); assert len(r['findings']) == 5"
